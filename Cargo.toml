[package]
name = "c0re"
version = "0.3.2"
edition = "2024"
description = "Private AI gateway in front of a local Ollama"
license = "UNLICENSED"
publish = false
default-run = "c0re"

[lib]
path = "src/lib.rs"

[[bin]]
name = "c0re"
path = "src/bin/c0re.rs"

[[bin]]
name = "c0re-svc"
path = "src/bin/c0re-svc.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.9"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
